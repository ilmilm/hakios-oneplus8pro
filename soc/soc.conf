# socs/sm8250/soc.conf: what this SoC repository is: the facts of a Qualcomm SM8250-family chip, whatever phone it is in.
# A phone with this SoC includes configs/sm8250.config from its defconfig. docs/porting/repositories.md has every word.
# Carried by this device's repository (devices/oneplus8pro/) until another sm8250 device splits it out.
# The cores are the OnePlus 8 Pro's tree: cpu0-3 at capacity 1024 (Cortex-A55), cpu4-7 at 1894 (Cortex-A77), cpu7 the
# 2.84 GHz prime -- eight cores and the biggest is core 7.

soc sm8250
	title       Qualcomm SM8250 family (Snapdragon 865 "kona"; the 865+ SM8250-AC too)
	vendor      Qualcomm
	cores       8, the biggest is core 7
	gpu         Adreno 650
	maintainer  ilmilm
